name: Test ve GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  qiskit:
    name: Qiskit çapraz doğrulama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/qiskit/requirements.txt
      - run: pip install -r tests/qiskit/requirements.txt
      - run: node scripts/export-fixtures.mjs > fixtures.json
      - run: python tests/qiskit/verify.py fixtures.json

  deploy:
    # Ücretsiz planda Pages yalnızca açık depolarda çalışır; depo açılınca kendiliğinden yayınlanır.
    if: github.event_name != 'pull_request' && !github.event.repository.private
    needs: [test, qiskit]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Yayınlanacak dosyaları topla
        run: |
          mkdir _site && cp -r index.html css js fonts _site/
          scripts/cache-bust.sh _site "${GITHUB_SHA::8}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
